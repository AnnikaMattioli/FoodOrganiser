{% extends "base.html" %}

{% block content %}
<div class="page-heading">
  <div>
    <p class="eyebrow">Recipe</p>
    <h1>{{ recipe_name }}</h1>
  </div>
  <div class="button-row">
    <a class="button secondary" href="{{ url_for('edit_recipe', recipe_name=recipe_name) }}">Edit</a>
    <form method="post" action="{{ url_for('delete_recipe', recipe_name=recipe_name) }}">
      <button class="danger" type="submit">Delete</button>
    </form>
  </div>
</div>

<section class="list-panel">
  {% for ingredient in recipe.ingredients %}
    <div class="list-row">
      <span>{{ ingredient.name }}</span>
      <strong>{{ format_amount(ingredient.amount, ingredient.unit) }}</strong>
    </div>
  {% endfor %}
</section>
{% endblock %}
