<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Food Organiser</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="{{ url_for('dashboard') }}">Food Organiser</a>
      <nav>
        <a href="{{ url_for('cupboard') }}">Cupboard</a>
        <a href="{{ url_for('recipes') }}">Recipe Book</a>
        <a href="{{ url_for('planner') }}">Planner</a>
        <a href="{{ url_for('budget') }}">Budget</a>
      </nav>
    </header>

    <main class="page">
      {% block content %}{% endblock %}
    </main>

    <script>
      const commonUnits = ["g", "kg", "ml", "l", "each", "tin", "can", "box", "bag", "punnet"];

      function unitSelect(name) {
        const options = commonUnits
          .map((unit) => `<option value="${unit}">${unit}</option>`)
          .join("");
        return `<select name="${name}">${options}</select>`;
      }

      function addIngredientRow(containerId, prefix) {
        const container = document.getElementById(containerId);
        const row = document.createElement("div");
        row.className = "ingredient-row";
        row.innerHTML = `
          <input name="${prefix}_name" placeholder="Ingredient">
          <input name="${prefix}_amount" type="number" min="0" step="0.01" placeholder="Amount">
          <input name="${prefix}_unit" placeholder="Unit">
          <button class="icon-button" type="button" onclick="this.parentElement.remove()" title="Remove">x</button>
        `;
        container.appendChild(row);
      }

      function addExtraRow(containerId) {
        const container = document.getElementById(containerId);
        const row = document.createElement("div");
        row.className = "ingredient-row";
        row.innerHTML = `
          <input name="extra_name" placeholder="Extra item">
          <input name="extra_amount" type="number" min="0" step="0.01" placeholder="Amount">
          ${unitSelect("extra_unit")}
          <button class="icon-button" type="button" onclick="this.parentElement.remove()" title="Remove">x</button>
        `;
        container.appendChild(row);
      }

      function copyShoppingList() {
        const text = document.getElementById("copyable-list").innerText;
        navigator.clipboard.writeText(text);
      }

      function setupRecipeSuggestions() {
        const recipeNames = window.recipeNames || [];
        const inputs = document.querySelectorAll(".recipe-search");

        inputs.forEach((input) => {
          const suggestions = input.parentElement.querySelector(".recipe-suggestions");

          function showSuggestions() {
            const query = input.value.trim().toLowerCase();
            const matches = recipeNames
              .filter((name) => !query || name.toLowerCase().includes(query))
              .slice(0, 8);

            suggestions.innerHTML = "";
            if (matches.length === 0) {
              suggestions.classList.remove("is-open");
              return;
            }

            matches.forEach((name) => {
              const button = document.createElement("button");
              button.type = "button";
              button.className = "suggestion-option";
              button.textContent = name;
              button.addEventListener("mousedown", (event) => {
                event.preventDefault();
                input.value = name;
                suggestions.classList.remove("is-open");
              });
              suggestions.appendChild(button);
            });

            suggestions.classList.add("is-open");
          }

          input.addEventListener("input", showSuggestions);
          input.addEventListener("focus", showSuggestions);
          input.addEventListener("blur", () => {
            setTimeout(() => suggestions.classList.remove("is-open"), 120);
          });
        });
      }

      document.addEventListener("DOMContentLoaded", setupRecipeSuggestions);
    </script>
  </body>
</html>
